spring:
  application:
    name: shyblack-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-a-256-bit-secret-key!!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/success}
  markets:
    websocket-enabled: ${MARKETS_WS_ENABLED:true}
    catalog-enabled: ${MARKETS_CATALOG_ENABLED:true}
    rest-base-url: ${BINANCE_REST_BASE_URL:https://api.binance.com}
    stream-url: ${BINANCE_STREAM_URL:wss://stream.binance.com:9443/ws/!ticker@arr}
    futures-rest-base-url: ${BINANCE_FUTURES_REST_BASE_URL:https://fapi.binance.com}
    futures-stream-url: ${BINANCE_FUTURES_STREAM_URL:wss://fstream.binance.com/ws/!ticker@arr}
    quote-asset: ${BINANCE_QUOTE_ASSET:USDT}
    exchange-info-refresh-ms: ${BINANCE_EXCHANGE_INFO_REFRESH_MS:3600000}
