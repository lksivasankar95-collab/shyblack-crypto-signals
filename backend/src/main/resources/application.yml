spring:
  application:
    name: shyblack-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-a-256-bit-secret-key!!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:455850227264-l2jvc43ija2355rq67t98m1l3n71i47s.apps.googleusercontent.com}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/success}
  markets:
    websocket-enabled: ${MARKETS_WS_ENABLED:true}
    catalog-enabled: ${MARKETS_CATALOG_ENABLED:true}
    rest-base-url: ${BINANCE_REST_BASE_URL:https://api.binance.com}
    stream-url: ${BINANCE_STREAM_URL:wss://stream.binance.com:9443/ws/!miniTicker@arr}
    futures-rest-base-url: ${BINANCE_FUTURES_REST_BASE_URL:https://fapi.binance.com}
    futures-stream-url: ${BINANCE_FUTURES_STREAM_URL:wss://fstream.binance.com/ws/!ticker@arr}
    quote-asset: ${BINANCE_QUOTE_ASSET:USDT}
    exchange-info-refresh-ms: ${BINANCE_EXCHANGE_INFO_REFRESH_MS:3600000}
  settings:
    risk-per-trade-ceiling-pct: ${SETTINGS_RISK_PER_TRADE_CEILING_PCT:2.0}
    max-position-size-pct: ${SETTINGS_MAX_POSITION_SIZE_PCT:20.0}
    max-open-positions: ${SETTINGS_MAX_OPEN_POSITIONS:4}
    encryption-secret-key: ${SETTINGS_ENCRYPTION_SECRET_KEY:dev-only-settings-encryption-key-seed-change-me}
    default-risk-profile: ${SETTINGS_DEFAULT_RISK_PROFILE:CONSERVATIVE}
    default-quote-currency: ${SETTINGS_DEFAULT_QUOTE_CURRENCY:USDT}
    default-position-sizing-mode: ${SETTINGS_DEFAULT_POSITION_SIZING_MODE:FIXED_PERCENT}
  paper-trading:
    fee-rate-pct: ${PAPER_FEE_RATE_PCT:0.10}
    slippage-pct: ${PAPER_SLIPPAGE_PCT:0.05}
    initial-balance: ${PAPER_INITIAL_BALANCE:10000.00}
    max-active-positions: ${PAPER_MAX_ACTIVE_POSITIONS:10}
    risk-per-trade-pct: ${PAPER_RISK_PER_TRADE_PCT:2.00}
    default-quote-currency: ${PAPER_DEFAULT_QUOTE_CURRENCY:USDT}
  futures-trading:
    # MOCK (default) = in-process simulator; safe for dev + tests.
    # EXCHANGE = real Binance USDT-M Futures signed API. Requires explicit ops flip.
    mode: ${FUTURES_TRADING_MODE:MOCK}
    rest-base-url: ${FUTURES_BINANCE_REST:https://testnet.binancefuture.com}
    stream-base-url: ${FUTURES_BINANCE_STREAM:wss://stream.binancefuture.com/ws}
    recv-window-ms: ${FUTURES_RECV_WINDOW_MS:5000}
    max-leverage: ${FUTURES_MAX_LEVERAGE:3}
    default-margin-mode: ${FUTURES_DEFAULT_MARGIN_MODE:ISOLATED}
    required-position-mode: ${FUTURES_REQUIRED_POSITION_MODE:ONE_WAY}
    default-max-notional: ${FUTURES_MAX_NOTIONAL:200.00}
    default-max-active: ${FUTURES_MAX_ACTIVE:2}
    default-daily-loss-pct: ${FUTURES_DAILY_LOSS_PCT:5.00}
    min-stop-distance-pct: ${FUTURES_MIN_STOP_DIST_PCT:0.30}
    liquidation-buffer-pct: ${FUTURES_LIQ_BUFFER_PCT:15.00}
    auto-execute: ${FUTURES_AUTO_EXECUTE:false}
    reconcile-interval-ms: ${FUTURES_RECONCILE_MS:30000}
    balance-refresh-ms: ${FUTURES_BALANCE_REFRESH_MS:60000}
  live-trading:
    # MOCK (default) = in-process simulator, safe for dev + tests.
    # EXCHANGE = real Binance signed API. Requires explicit ops flip.
    mode: ${LIVE_TRADING_MODE:MOCK}
    spot-rest-base-url: ${LIVE_BINANCE_SPOT_REST:https://testnet.binance.vision}
    spot-stream-base-url: ${LIVE_BINANCE_SPOT_STREAM:wss://testnet.binance.vision/ws}
    futures-rest-base-url: ${LIVE_BINANCE_FUTURES_REST:https://testnet.binancefuture.com}
    recv-window-ms: ${LIVE_RECV_WINDOW_MS:5000}
    default-max-notional: ${LIVE_MAX_NOTIONAL:200.00}
    default-max-active: ${LIVE_MAX_ACTIVE:3}
    default-daily-loss-pct: ${LIVE_DAILY_LOSS_PCT:5.00}
    auto-execute: ${LIVE_AUTO_EXECUTE:false}
    reconcile-interval-ms: ${LIVE_RECONCILE_MS:30000}
    balance-refresh-ms: ${LIVE_BALANCE_REFRESH_MS:60000}
  backtesting:
    engine-version: ${BACKTEST_ENGINE_VERSION:backtest-engine/v1}
    max-candles: ${BACKTEST_MAX_CANDLES:20000}
    max-concurrent-runs: ${BACKTEST_MAX_CONCURRENT:2}
    max-range-days: ${BACKTEST_MAX_RANGE_DAYS:365}
    default-warmup-candles: ${BACKTEST_DEFAULT_WARMUP:200}
