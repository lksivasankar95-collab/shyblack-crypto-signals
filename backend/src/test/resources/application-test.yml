spring:
  datasource:
    url: jdbc:h2:mem:shyblack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - email
              - profile

jwt:
  secret: test-only-change-me-use-a-256-bit-secret-key!!

app:
  google:
    client-id: test-google-client-id
  markets:
    websocket-enabled: false
    catalog-enabled: false
    rest-base-url: https://api.binance.com
    stream-url: wss://stream.binance.com:9443/ws/!ticker@arr
    futures-rest-base-url: https://fapi.binance.com
    futures-stream-url: wss://fstream.binance.com/ws/!ticker@arr
    quote-asset: USDT
    exchange-info-refresh-ms: 3600000
